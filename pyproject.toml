[project]
name = "seelm"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "einops>=0.8.2",
    "jaxtyping>=0.3.11",
    "numpy>=2.5.3",
    "regex>=2026.9.29",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["architecture", "tokenization"]

[tool.pytest.ini_options]
xfail_strict = true
